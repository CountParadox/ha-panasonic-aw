ptz:
  target:
    entity:
      integration: panasonic_aw
      domain: camera
  fields:
    pan:
      selector:
        number: { min: -100, max: 100, step: 1, mode: slider }
    tilt:
      selector:
        number: { min: -100, max: 100, step: 1, mode: slider }
    zoom:
      selector:
        number: { min: -100, max: 100, step: 1, mode: slider }
    focus:
      selector:
        number: { min: -100, max: 100, step: 1, mode: slider }
    duration:
      selector:
        number: { min: 0.05, max: 10, step: 0.05, unit_of_measurement: s, mode: box }

stop:
  target:
    entity:
      integration: panasonic_aw
      domain: camera

preset_recall:
  target:
    entity:
      integration: panasonic_aw
      domain: camera
  fields:
    preset:
      required: true
      selector:
        number: { min: 1, max: 100, step: 1, mode: box }

preset_save:
  target:
    entity:
      integration: panasonic_aw
      domain: camera
  fields:
    preset:
      required: true
      selector:
        number: { min: 1, max: 100, step: 1, mode: box }

preset_delete:
  target:
    entity:
      integration: panasonic_aw
      domain: camera
  fields:
    preset:
      required: true
      selector:
        number: { min: 1, max: 100, step: 1, mode: box }

move_absolute:
  target:
    entity:
      integration: panasonic_aw
      domain: camera
  fields:
    pan:
      selector:
        number: { min: -175, max: 175, step: 0.1, unit_of_measurement: "°", mode: box }
    tilt:
      selector:
        number: { min: -30, max: 90, step: 0.1, unit_of_measurement: "°", mode: box }
    zoom:
      selector:
        number: { min: 0, max: 100, step: 0.1, unit_of_measurement: "%", mode: slider }

send_command:
  target:
    entity:
      integration: panasonic_aw
      domain: camera
  fields:
    interface:
      required: true
      default: ptz
      selector:
        select:
          options:
            - ptz
            - cam
    command:
      required: true
      example: "APC"
      selector:
        text:
